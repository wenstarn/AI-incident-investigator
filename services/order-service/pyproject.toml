[project]
name = "order-service"
version = "0.1.0"
description = "Order service for AI Incident Investigator"
requires-python = ">=3.12"
dependencies = [
    "fault-injection",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<6",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
fault-injection = { workspace = true }
