[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "ruff>=0.14,<1",
]

[tool.uv.workspace]
members = [
    "services/user-service",
    "services/order-service",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = [
    "integration: requires PostgreSQL or Redis through TEST_DATABASE_URL/TEST_REDIS_URL",
]
testpaths = [
    "services/user-service/tests",
    "services/order-service/tests",
]
