server {
    listen 8080;
    server_tokens off;
    location ~ ^/read-only/services/(user-service|order-service|postgres|redis|frontend)/(status|logs)$ {
        limit_except GET { deny all; }
        proxy_pass http://docker-executor:8004;
        proxy_buffering on;
        proxy_read_timeout 5s;
        client_max_body_size 1k;
    }
    location / { return 404; }
}
